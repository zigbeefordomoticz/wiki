<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Recording and recalling a Zigbee scene</title>
<desc id="d">Sequence between you in the WebUI, the plugin and two lamps. With a chosen ID the plugin first asks each lamp which scenes it holds. To capture, the plugin sends Add Scene then Store Scene to each lamp, one frame per lamp, and each lamp saves its own current state. To recall, the plugin sends a single group-cast Recall Scene and every lamp applies the state it saved.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b5cad"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
</defs>
<rect width="1000" height="860" fill="#ffffff"/>
<rect x="12" y="96" width="976" height="74" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="26" y="118" font-size="14" font-weight="600" fill="#1f2328">1 · Set the scene</text>
<rect x="12" y="180" width="976" height="172" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-dasharray="6 4"/>
<text x="26" y="202" font-size="14" font-weight="600" fill="#1f2328">2 · Only with a chosen Scene ID: is it free?</text>
<rect x="12" y="362" width="976" height="310" rx="8" fill="#eef6ff" stroke="#54aeff"/>
<text x="26" y="384" font-size="14" font-weight="600" fill="#1f2328">3 · Capture: one exchange with each device</text>
<rect x="12" y="682" width="976" height="156" rx="8" fill="#eafaf0" stroke="#4ac26b"/>
<text x="26" y="704" font-size="14" font-weight="600" fill="#1f2328">4 · Recall: one frame for the whole group</text>
<rect x="46" y="26" width="164" height="38" rx="6" fill="#ffffff" stroke="#57606a"/>
<text x="128" y="50" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">You, in the WebUI</text>
<line x1="128" y1="64" x2="128" y2="838" stroke="#8c959f" stroke-dasharray="3 4"/>
<rect x="280" y="26" width="164" height="38" rx="6" fill="#ffffff" stroke="#57606a"/>
<text x="362" y="50" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Plugin</text>
<line x1="362" y1="64" x2="362" y2="838" stroke="#8c959f" stroke-dasharray="3 4"/>
<rect x="558" y="26" width="164" height="38" rx="6" fill="#ffffff" stroke="#57606a"/>
<text x="640" y="50" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Lamp A</text>
<line x1="640" y1="64" x2="640" y2="838" stroke="#8c959f" stroke-dasharray="3 4"/>
<rect x="788" y="26" width="164" height="38" rx="6" fill="#ffffff" stroke="#57606a"/>
<text x="870" y="50" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Lamp B</text>
<line x1="870" y1="64" x2="870" y2="838" stroke="#8c959f" stroke-dasharray="3 4"/>
<rect x="33.0" y="124" width="190" height="25" rx="5" fill="#ffffff" stroke="#8c959f"/>
<text x="128" y="141" font-size="12.5" text-anchor="middle" fill="#1f2328">Dim, switch, adjust the lights</text>
<rect x="575.0" y="124" width="130" height="25" rx="5" fill="#ffffff" stroke="#8c959f"/>
<text x="640" y="141" font-size="12.5" text-anchor="middle" fill="#1f2328">Its current state</text>
<rect x="805.0" y="124" width="130" height="25" rx="5" fill="#ffffff" stroke="#8c959f"/>
<text x="870" y="141" font-size="12.5" text-anchor="middle" fill="#1f2328">Its current state</text>
<line x1="131" y1="226" x2="359" y2="226" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150.25" y="206" width="189.5" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="245.0" y="219" font-size="13" text-anchor="middle" fill="#1f2328">Capture, with Scene ID 2a</text>
<line x1="365" y1="258" x2="637" y2="258" stroke="#57606a" stroke-width="2" marker-end="url(#ao)"/>
<rect x="424.0" y="238" width="154.0" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="501.0" y="251" font-size="13" text-anchor="middle" fill="#1f2328">Get Scene Membership</text>
<line x1="365" y1="280" x2="867" y2="280" stroke="#57606a" stroke-width="2" marker-end="url(#ao)"/>
<line x1="637" y1="308" x2="365" y2="308" stroke="#57606a" stroke-width="2" marker-end="url(#ao)" stroke-dasharray="6 4"/>
<rect x="434.65" y="288" width="132.7" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="501.0" y="301" font-size="13" text-anchor="middle" fill="#1f2328">The scenes I hold</text>
<line x1="867" y1="330" x2="365" y2="330" stroke="#57606a" stroke-width="2" marker-end="url(#ao)" stroke-dasharray="6 4"/>
<rect x="30.0" y="250" width="196" height="42" rx="5" fill="#fff8e6" stroke="#d4a72c"/>
<text x="128" y="267" font-size="12.5" text-anchor="middle" fill="#1f2328">ID found on a device:</text>
<text x="128" y="284" font-size="12.5" text-anchor="middle" fill="#1f2328">refused, nothing is overwritten</text>
<line x1="131" y1="408" x2="359" y2="408" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="164.45" y="388" width="161.1" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="245.0" y="401" font-size="13" text-anchor="middle" fill="#1f2328">Capture current state</text>
<line x1="365" y1="440" x2="637" y2="440" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="377.85" y="420" width="246.29999999999998" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="501.0" y="433" font-size="13" text-anchor="middle" fill="#1f2328">Add Scene (group, ID, transition)</text>
<line x1="637" y1="470" x2="365" y2="470" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<rect x="431.1" y="450" width="139.8" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="501.0" y="463" font-size="13" text-anchor="middle" fill="#1f2328">Add Scene response</text>
<line x1="365" y1="500" x2="637" y2="500" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="455.95" y="480" width="90.1" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="501.0" y="493" font-size="13" text-anchor="middle" fill="#1f2328">Store Scene</text>
<rect x="555.0" y="510" width="170" height="42" rx="5" fill="#eef6ff" stroke="#54aeff"/>
<text x="640" y="527" font-size="12.5" text-anchor="middle" fill="#1f2328">Saves its own state</text>
<text x="640" y="544" font-size="12.5" text-anchor="middle" fill="#1f2328">in its scene table</text>
<line x1="637" y1="574" x2="365" y2="574" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<rect x="424.0" y="554" width="154.0" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="501.0" y="567" font-size="13" text-anchor="middle" fill="#1f2328">Store Scene response</text>
<line x1="365" y1="610" x2="867" y2="610" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="362.0" y="590" width="296.0" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="510" y="603" font-size="13" text-anchor="middle" fill="#1f2328">The same exchange with each other device</text>
<line x1="359" y1="650" x2="131" y2="650" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<rect x="114.75" y="630" width="260.5" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="245.0" y="643" font-size="13" text-anchor="middle" fill="#1f2328">Saved 2 / 2, or a status per device</text>
<line x1="131" y1="728" x2="359" y2="728" stroke="#0b5cad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="224.8" y="708" width="40.4" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="245.0" y="721" font-size="13" text-anchor="middle" fill="#1f2328">Test</text>
<line x1="365" y1="764" x2="867" y2="764" stroke="#1a7f37" stroke-width="2" marker-end="url(#ag)"/>
<rect x="360.55" y="744" width="288.9" height="17" fill="#ffffff" fill-opacity="0.92" rx="3"/>
<text x="505" y="757" font-size="13" text-anchor="middle" fill="#1f2328">Recall Scene: a single group-cast frame</text>
<circle cx="640" cy="764" r="5" fill="#1a7f37"/>
<rect x="561.0" y="778" width="158" height="25" rx="5" fill="#eafaf0" stroke="#4ac26b"/>
<text x="640" y="795" font-size="12.5" text-anchor="middle" fill="#1f2328">Applies what it saved</text>
<rect x="791.0" y="778" width="158" height="25" rx="5" fill="#eafaf0" stroke="#4ac26b"/>
<text x="870" y="795" font-size="12.5" text-anchor="middle" fill="#1f2328">Applies what it saved</text>
<rect x="30.0" y="756" width="196" height="42" rx="5" fill="#eafaf0" stroke="#4ac26b"/>
<text x="128" y="773" font-size="12.5" text-anchor="middle" fill="#1f2328">A remote bound to the group</text>
<text x="128" y="790" font-size="12.5" text-anchor="middle" fill="#1f2328">can send the same frame</text>
</svg>